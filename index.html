<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tasks | To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>My Tasks</h1>
      <p id="today" class="today"></p>
    </header>

    <section class="progress" aria-label="Progress">
      <div class="progress-text">
        <span id="progress-label">0 of 0 done</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </section>

    <div id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off" maxlength="120">
      <button type="button" id="add-btn" class="add-btn">Add task</button>
    </div>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Pending</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-done" class="clear-btn">Clear completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
